<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Marker Tracker (Final)</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #111; color: #fff; padding-bottom: 50px; }
        
        /* メイン画面 */
        #container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
        canvas { 
            width: 100%; height: auto; background: #000; border: 2px solid #333; 
            border-radius: 8px; display: none;
        }
        video { display: none; }

        /* ボタン類 */
        .btn-group { margin: 15px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { 
            padding: 12px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;
            color: white; background-color: #555; transition: 0.2s;
        }
        button:active { transform: scale(0.96); }
        .btn-blue { background-color: #2196F3; }
        .btn-green { background-color: #4CAF50; }
        .btn-red { background-color: #E91E63; }
        .active { border: 2px solid white; opacity: 1; }

        /* ステータス表示 */
        #status { font-size: 1.2rem; font-weight: bold; margin: 10px; color: #aaa; }
        #info { font-size: 0.9rem; color: #888; margin-bottom: 5px; }

        /* マーカー表示用（テスト） */
        #test-marker { 
            margin-top: 30px; padding: 20px; background: white; display: inline-block; 
            border-radius: 10px; display: none;
        }
        #test-marker img { width: 150px; height: 150px; image-rendering: pixelated; }
        #test-marker p { color: black; margin: 5px 0 0 0; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status">待機中...</div>
    <div id="info">Resolution: -</div>

    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="btn-group">
        <button id="btn-cam" class="btn-blue">📷 カメラ起動</button>
        <button id="btn-ble" class="btn-green">⚡ Bluetooth接続</button>
    </div>

    <div class="btn-group">
        <button id="mode3" class="active" onclick="setMode(3)">Mode 3: 確認</button>
        <button id="mode1" onclick="setMode(1)">Mode 1: 記録</button>
        <button id="mode2" onclick="setMode(2)">Mode 2: 追尾</button>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
        <button onclick="toggleMarker()" style="background:#444;">🛠️ テスト用マーカーを表示</button>
        <div id="test-marker">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAACDSURBVHhe7dsxDQAxEATBdMJ/IyZ4lMceVOypqwcXZnbf/z8A4CgAHAVwFACOAsBRADgKAEcB4CgAHAWHowBwFACXs7u/d39/FwC/4SgAHAVwFACOAsBRADgKAEcB4CgAHAWHowBwFACXs7u/d39/FwC/4SgAHAVwFACOAsBRADgKAEcBYC6vW0F3s5qjngAAAABJRU5ErkJggg==">
            <p>Original ArUco ID:0</p>
        </div>
    </div>

    <video id="videoElement" playsinline></video>

    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/cv.js"></script>
    <script src="https://raw.githack.com/jcmellado/js-aruco/master/src/aruco.js"></script>

    <script>
        // 設定
        const MARKER_SIZE = 100; // 推定に使うマーカーサイズ(mm) ※今は座標取得だけなので影響小
        let detector, video, canvas, ctx;
        let animationId;
        
        // 変数
        let currentMode = 3; // 1:REC, 2:AUTO, 3:CHECK
        let bleCharacteristic = null;
        let isSending = false;
        let recordedData = [];
        let isRecording = false;
        let startTime = 0;

        window.onload = function() {
            video = document.getElementById('videoElement');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });

            // AR検出器の初期化
            detector = new AR.Detector();

            document.getElementById('btn-cam').onclick = startCamera;
            document.getElementById('btn-ble').onclick = connectBle;
        };

        // カメラ起動
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                video.play();
                canvas.style.display = 'block';
                document.getElementById('status').textContent = "カメラ動作中";
                
                // ループ開始
                cancelAnimationFrame(animationId);
                processLoop();
            } catch (err) {
                alert("カメラエラー: " + err);
            }
        }

        // メイン処理ループ
        function processLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // キャンバスサイズ調整
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('info').textContent = `Resolution: ${canvas.width} x ${canvas.height}`;
                }

                // 描画
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // ★ ARマーカー検出
                // js-aruco は "Original ArUco" のみを検出します
                let markers = detector.detect(imageData);
                let target = null;

                // ID:0 を優先して探す
                for(let m of markers) {
                    if(m.id === 0) target = m;
                }
                // ID:0がなければ最初に見つかったものを採用
                if(!target && markers.length > 0) target = markers[0];

                if (target) {
                    drawMarker(target);
                    let pose = calculatePose(target);
                    
                    // 画面表示更新
                    document.getElementById('status').style.color = "#4CAF50";
                    document.getElementById('status').textContent = `ID:${target.id} X:${pose.x} Y:${pose.y} Ang:${pose.deg}°`;

                    // Bluetooth送信 (Mode 2)
                    if (currentMode === 2 && bleCharacteristic) {
                        sendBle(pose.normX, pose.normY);
                    }
                } else {
                    document.getElementById('status').style.color = "#aaa";
                    document.getElementById('status').textContent = "Searching...";
                }
            }
            animationId = requestAnimationFrame(processLoop);
        }

        // マーカー情報計算
        function calculatePose(marker) {
            let c = marker.corners;
            
            // 重心
            let cx = (c[0].x + c[1].x + c[2].x + c[3].x) / 4;
            let cy = (c[0].y + c[1].y + c[2].y + c[3].y) / 4;

            // 角度 (上辺の中点を「前」とする)
            let topX = (c[0].x + c[1].x) / 2;
            let topY = (c[0].y + c[1].y) / 2;
            
            let dx = topX - cx;
            let dy = topY - cy;
            
            // 画面上が0度になるように変換
            let rad = Math.atan2(dy, dx);
            let deg = Math.round(rad * (180 / Math.PI) + 90);
            if (deg < 0) deg += 360;

            // 矢印描画
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + dx * 2, cy + dy * 2);
            ctx.strokeStyle = "cyan";
            ctx.lineWidth = 4;
            ctx.stroke();

            return {
                x: Math.round(cx),
                y: Math.round(cy),
                normX: Math.round((cx / canvas.width) * 255),
                normY: Math.round((cy / canvas.height) * 255),
                deg: deg
            };
        }

        // マーカー枠描画
        function drawMarker(marker) {
            let c = marker.corners;
            ctx.lineWidth = 3;
            
            // 枠線
            ctx.strokeStyle = "lime";
            ctx.beginPath();
            ctx.moveTo(c[0].x, c[0].y);
            ctx.lineTo(c[1].x, c[1].y);
            ctx.lineTo(c[2].x, c[2].y);
            ctx.lineTo(c[3].x, c[3].y);
            ctx.closePath();
            ctx.stroke();

            // コーナー (赤=左上)
            ctx.fillStyle = "red"; ctx.fillRect(c[0].x-4, c[0].y-4, 8, 8);
            ctx.fillStyle = "lime"; ctx.fillRect(c[1].x-4, c[1].y-4, 8, 8);
            ctx.fillStyle = "blue"; ctx.fillRect(c[2].x-4, c[2].y-4, 8, 8);
            ctx.fillStyle = "yellow"; ctx.fillRect(c[3].x-4, c[3].y-4, 8, 8);

            // ID
            ctx.fillStyle = "lime";
            ctx.font = "bold 20px Arial";
            ctx.fillText("ID:" + marker.id, c[0].x, c[0].y - 10);
        }

        // Bluetooth接続
        async function connectBle() {
            const SERVICE_UUID = '0000aaaa-0000-1000-8000-00805f9b34fb';
            const CHARACTERISTIC_UUID = '0000bbbb-0000-1000-8000-00805f9b34fb';
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                alert("接続成功！");
                document.getElementById('btn-ble').style.backgroundColor = "#4CAF50";
                document.getElementById('btn-ble').textContent = "BLE接続済み";
            } catch (e) {
                alert("接続失敗: " + e);
            }
        }

        // データ送信 (間引き処理付き)
        function sendBle(x, y) {
            if (isSending) return;
            // ランダム間引き (通信負荷軽減)
            if (Math.random() > 0.7) { 
                isSending = true;
                const HEADER_AUTO = 0x02;
                bleCharacteristic.writeValue(new Uint8Array([HEADER_AUTO, x, y]))
                    .then(() => isSending = false)
                    .catch(() => isSending = false);
            }
        }

        // UI制御
        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            if(m===1) document.getElementById('mode1').classList.add('active');
            if(m===2) document.getElementById('mode2').classList.add('active');
            if(m===3) document.getElementById('mode3').classList.add('active');
        }

        function toggleMarker() {
            const el = document.getElementById('test-marker');
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
