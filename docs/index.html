<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myLRA Controller (当日用)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>2-Color Tracker (Yellow / Red)</h3>

    <div id="status">Bluetooth未接続</div>
    <div id="loading">OpenCV ロード中...</div>
    <div id="resolution-display">Resolution: - x -</div>

    <canvas id="canvas"></canvas>
    <video id="videoElement" autoplay playsinline muted style="display:none;"></video>

    <div>
        <button id="connectButton" class="btn-sys" style="background-color: #007bff;">① Bluetooth 接続</button>
        <button id="cameraButton" class="btn-sys">② カメラ起動 (Webcam)</button>
        <button id="detectToggle" class="btn-sys" style="background-color: #607D8B;">🎯 検出設定</button>
    </div>

    <div id="detect-area" style="display:none; background:#2a2a2a; padding:12px; border-radius:8px; margin-top:10px; text-align:left;">
        <div style="font-weight:bold; margin-bottom:6px; color:#90A4AE;">検出設定 (色キャリブレーション)</div>
        <p style="font-size:0.8rem; color:#bbb; margin:4px 0;">「色を取得」を押してから映像内のマーカーをクリックすると、その色に自動調整します。スライダーで微調整も可能。「マスク表示」で検出範囲を確認できます。</p>

        <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <div class="detect-col">
                <div style="font-weight:bold; color:#FFD54F;">中心マーカー (黄)</div>
                <button id="c-sample" class="sample-btn btn-sys" style="background:#FBC02D; color:#000; padding:6px 10px;">🖱️ 色を取得</button>
                <div class="slider-row"><label>色相 H</label><input type="range" id="c-hue" min="0" max="179"><span id="c-hue-v" class="sv"></span></div>
                <div class="slider-row"><label>幅 ±</label><input type="range" id="c-hueW" min="2" max="89"><span id="c-hueW-v" class="sv"></span></div>
                <div class="slider-row"><label>彩度 S≥</label><input type="range" id="c-sMin" min="0" max="255"><span id="c-sMin-v" class="sv"></span></div>
                <div class="slider-row"><label>明度 V≥</label><input type="range" id="c-vMin" min="0" max="255"><span id="c-vMin-v" class="sv"></span></div>
            </div>
            <div class="detect-col">
                <div style="font-weight:bold; color:#FF8A80;">前方マーカー (赤)</div>
                <button id="f-sample" class="sample-btn btn-sys" style="background:#E53935; padding:6px 10px;">🖱️ 色を取得</button>
                <div class="slider-row"><label>色相 H</label><input type="range" id="f-hue" min="0" max="179"><span id="f-hue-v" class="sv"></span></div>
                <div class="slider-row"><label>幅 ±</label><input type="range" id="f-hueW" min="2" max="89"><span id="f-hueW-v" class="sv"></span></div>
                <div class="slider-row"><label>彩度 S≥</label><input type="range" id="f-sMin" min="0" max="255"><span id="f-sMin-v" class="sv"></span></div>
                <div class="slider-row"><label>明度 V≥</label><input type="range" id="f-vMin" min="0" max="255"><span id="f-vMin-v" class="sv"></span></div>
            </div>
        </div>

        <div style="margin-top:10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
            <label>検出解像度
                <select id="d-scale" class="param-input" style="width:auto;">
                    <option value="0.5">1/2 (高速)</option>
                    <option value="0.75">3/4</option>
                    <option value="1">等倍 (高精度)</option>
                </select>
            </label>
            <span class="slider-row" style="margin:0;"><label>最小面積</label><input type="range" id="d-area" min="3" max="300" value="20"><span id="d-area-v" class="sv">20</span></span>
            <label><input type="checkbox" id="d-morph" checked> ノイズ除去</label>
            <label><input type="checkbox" id="d-mask"> マスク表示</label>
        </div>
    </div>

    <div class="mode-tabs">
        <button id="mode3Btn" class="tab active">Mode 3<br><span style="font-size:0.7em">動作確認</span></button>
        <button id="mode2Btn" class="tab">Mode 2<br><span style="font-size:0.7em">自動追尾</span></button>
    </div>

    <div id="dpad-area" class="mode3-active">
        <button id="btn-up" class="d-btn" data-dir="1">▲</button>
        <button id="btn-left" class="d-btn" data-dir="4">◀</button>
        <button id="btn-right" class="d-btn" data-dir="3">▶</button>
        <button id="btn-down" class="d-btn" data-dir="2">▼</button>
    </div>

    <div id="param-area">
        <div style="font-weight:bold; margin-bottom:10px; color:#FF9800;">パラメータ設定</div>
        <div class="param-row">
            <div class="param-group"><label>Res 1</label><input type="number" id="p-res1" class="param-input" value="10"></div>
            <div class="param-group"><label>Rep 1</label><input type="number" id="p-rep1" class="param-input" value="4"></div>
        </div>
        <div class="param-row">
            <div class="param-group"><label>Res 2</label><input type="number" id="p-res2" class="param-input" value="35"></div>
            <div class="param-group"><label>Rep 2</label><input type="number" id="p-rep2" class="param-input" value="2"></div>
        </div>
        <button id="btn-update">パラメータ更新</button>
        <div style="margin-top:12px;">
            <div style="font-size:0.8rem; color:#aaa; margin-bottom:4px;">出力波形プレビュー(現在のパラメータ / 上:前後 下:左右)</div>
            <canvas id="wave-canvas" width="360" height="150" style="width:100%; max-width:360px; background:#1a1a1a; border-radius:6px; display:block; margin:0 auto;"></canvas>
        </div>
    </div>

    <script async src="opencv.js"></script>
    <script src="script.js"></script>
</body>
</html>
